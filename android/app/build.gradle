plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    namespace = "com.img.royalcorp"
    compileSdk = flutter.compileSdkVersion
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_1_8
        targetCompatibility = JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // TODO: Specify your own unique Application ID (https://developer.android.com/studio/build/application-id.html).
        applicationId = "com.img.royalcorp"
        // You can update the following values to match your application needs.
        // For more information, see: https://flutter.dev/to/review-gradle-config.
        minSdk = 23
        targetSdk = 35
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    // Product flavors for environment separation
    flavorDimensions "environment"
    productFlavors {
        development {
            dimension "environment"
            applicationIdSuffix ".dev"
            versionNameSuffix "-dev"
        }
        staging {
            dimension "environment"
            applicationIdSuffix ".stg"
            versionNameSuffix "-stg"
        }
        production {
            dimension "environment"
        }
    }

    signingConfigs {
        debug {
            if (localProperties['STORE_FILE_PATH']) {
                storeFile file(localProperties['STORE_FILE_PATH'])
                storePassword localProperties['DEV_STORE_PASSWORD']
                keyAlias localProperties['DEV_KEY_ALIAS']
                keyPassword localProperties['DEV_KEY_PASSWORD']
            }
        }
        
        release {
            if (localProperties['STORE_FILE_PATH']) {
                storeFile file(localProperties['STORE_FILE_PATH'])
                storePassword localProperties['PROD_STORE_PASSWORD']
                keyAlias localProperties['PROD_KEY_ALIAS']
                keyPassword localProperties['PROD_KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        debug {
            if (localProperties['STORE_FILE_PATH']) {
                signingConfig signingConfigs.debug
            }
        }
        
        release {
            if (localProperties['STORE_FILE_PATH']) {
                signingConfig signingConfigs.release
            }
        }
    }
}

flutter {
    source = "../.."
}
